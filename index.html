<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursada · Autogestión universitaria</title>
<meta name="description" content="Cursada es el portal de autogestión universitaria: inscripciones, notas, asistencia, constancias y avisos para estudiantes, docentes y administración.">
<meta name="theme-color" content="#2645D6">
<meta property="og:title" content="Cursada · Autogestión universitaria">
<meta property="og:description" content="Inscribite a materias y seguí tus solicitudes desde un solo lugar.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="manifest" href="assets/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/componentes.css">
<link rel="stylesheet" href="css/vistas.css">
</head>
<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>

<!-- Pantalla de ingreso (autenticación simulada) -->
<div id="vista-ingreso" class="oculto"></div>

<!-- Aplicación autenticada -->
<div id="vista-app" class="oculto">
  <header class="barra">
    <a class="marca" id="marcaInicio" href="#/inicio" aria-label="Cursada, ir al inicio">
      <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#isotipo"/></svg>
      <span class="marca-nombre">cursada</span>
      <span class="marca-sub">Autogestión universitaria</span>
    </a>
    <span class="barra-espacio"></span>
    <span class="barra-periodo" id="barraPeriodo"></span>
    <label class="interruptor" title="Muestra la secuencia DS01 / DS02 y las herramientas de prueba">
      <input type="checkbox" id="chkDemo" onchange="App.alternarDemo(this.checked)"> <span class="interruptor-txt">Modo demo</span>
    </label>
    <div id="campana"></div>
    <div class="usuario" id="usuario"></div>
    <button class="btn btn-secundario btn-chico" id="btnSalir" onclick="App.salir()">Salir</button>
  </header>

  <div class="app" id="app">
    <nav class="lateral" id="menu" aria-label="Menú principal"></nav>

    <main class="contenido" id="contenido" tabindex="-1"></main>

    <aside class="panel-traza oculto" id="panelTraza" aria-label="Secuencia ejecutada">
      <header>
        <div style="flex:1">
          <h2 id="tituloTraza">Secuencia DS01</h2>
          <p>Mensajes numerados igual que el diagrama</p>
        </div>
        <button class="btn btn-secundario btn-chico" onclick="App.alternarDemo(false)">Cerrar</button>
      </header>
      <div class="traza" id="traza" aria-live="polite"></div>
    </aside>

    <footer class="pie">
      <span>Cursada · MVP del Ecosistema Integral de Gestión Universitaria</span>
      <span>Trabajo práctico de Diseño de Aplicaciones Web, UNLaM 2026. Datos ficticios.</span>
    </footer>
  </div>
</div>

<!-- Diálogo y notificaciones reutilizables -->
<dialog class="dialogo" id="dialogo" aria-labelledby="dialogoTitulo"></dialog>
<div class="notificaciones" id="notificaciones" role="status" aria-live="polite"></div>

<!-- Isotipo reutilizable -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="isotipo" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="16" fill="#2645D6"/>
    <g fill="#FFFFFF" fill-opacity=".28">
      <rect x="12" y="12" width="11" height="11" rx="3"/><rect x="26.5" y="12" width="11" height="11" rx="3"/><rect x="41" y="12" width="11" height="11" rx="3"/>
      <rect x="12" y="26.5" width="11" height="11" rx="3"/><rect x="41" y="26.5" width="11" height="11" rx="3"/>
      <rect x="12" y="41" width="11" height="11" rx="3"/><rect x="26.5" y="41" width="11" height="11" rx="3"/><rect x="41" y="41" width="11" height="11" rx="3"/>
    </g>
    <rect x="26.5" y="26.5" width="11" height="11" rx="3" fill="#FFD84D"/>
  </symbol>
</svg>

<!-- «entity» Modelo de dominio -->
<script src="js/modelo/enumeraciones.js"></script>
<script src="js/modelo/entidades.js"></script>
<!-- Servicios: notificaciones, correo, PDF y guardado -->
<script src="js/servicios/notificaciones.js"></script>
<script src="js/servicios/pdf.js"></script>
<script src="js/servicios/repositorio.js"></script>
<!-- «control» -->
<script src="js/control/traza.js"></script>
<script src="js/control/InscripcionController.js"></script>
<script src="js/control/CalificacionController.js"></script>
<script src="js/control/GestionController.js"></script>
<!-- Datos de ejemplo -->
<script src="js/datos/datos.js"></script>
<!-- «boundary» Vistas -->
<script src="js/vista/utilidades.js"></script>
<script src="js/vista/grilla.js"></script>
<script src="js/vista/VistaIngreso.js"></script>
<script src="js/vista/estudiante/VistaEstudiante.js"></script>
<script src="js/vista/estudiante/PantallaInscripcion.js"></script>
<script src="js/vista/docente/VistaDocente.js"></script>
<script src="js/vista/admin/VistaAdmin.js"></script>
<script src="js/vista/VistaGuia.js"></script>
<!-- Arranque, sesión y rutas -->
<script src="js/app.js"></script>
</body>
</html>
